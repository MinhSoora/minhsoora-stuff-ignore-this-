<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>OBS GPS Speed</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    font-family:Arial,Helvetica,sans-serif;
}

#speed{
    position:fixed;
    right:30px;
    bottom:25px;
    color:white;
    text-align:center;
    user-select:none;
    text-shadow:
        0 0 8px rgba(0,0,0,.8),
        0 0 20px rgba(0,0,0,.6);
}

#value{
    font-size:92px;
    font-weight:bold;
    line-height:0.9;
}

#unit{
    font-size:34px;
    font-weight:bold;
    margin-top:5px;
}
</style>
</head>

<body>

<div id="speed">
    <div id="value">0</div>
    <div id="unit">KM/H</div>
</div>

<script>

let lastPos=null;

function distance(lat1,lon1,lat2,lon2){

    const R=6371000;

    const dLat=(lat2-lat1)*Math.PI/180;
    const dLon=(lon2-lon1)*Math.PI/180;

    const a=
        Math.sin(dLat/2)**2+
        Math.cos(lat1*Math.PI/180)*
        Math.cos(lat2*Math.PI/180)*
        Math.sin(dLon/2)**2;

    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function update(position){

    let kmh=0;

    if(position.coords.speed!=null && !isNaN(position.coords.speed)){
        kmh=position.coords.speed*3.6;
    }
    else if(lastPos){

        const d=distance(
            lastPos.coords.latitude,
            lastPos.coords.longitude,
            position.coords.latitude,
            position.coords.longitude
        );

        const dt=(position.timestamp-lastPos.timestamp)/1000;

        if(dt>0){
            kmh=(d/dt)*3.6;
        }
    }

    lastPos=position;

    if(kmh<1) kmh=0;

    document.getElementById("value").innerText=Math.round(kmh);
}

function error(e){
    console.log(e);
}

if("geolocation" in navigator){

    navigator.geolocation.watchPosition(
        update,
        error,
        {
            enableHighAccuracy:true,
            maximumAge:0,
            timeout:5000
        }
    );

}else{
    alert("Trình duyệt không hỗ trợ GPS");
}

</script>

</body>
</html>
