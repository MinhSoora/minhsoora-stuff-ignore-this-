<!DOCTYPE html>
<html lang="vi">
<head>

<title>YouTube Live</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
html,body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}
iframe{
    width:100%;
    height:100%;
    border:none;
}
</style>
</head>

<body>

<iframe
    src="https://www.youtube.com/embed/live_stream?channel=UCgVoxNLIlP_XS5ZBk-3dsIA&autoplay=1&mute=0&controls=1&playsinline=1&rel=0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
    allowfullscreen>
</iframe>

</body>
</html>
