<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>GPS Speed</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:transparent;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#speed{
    position:fixed;
    right:30px;
    bottom:25px;
    color:#fff;
    text-align:center;
    user-select:none;
}

#value{
    font-size:92px;
    font-weight:700;
    line-height:.9;
}

#unit{
    font-size:34px;
    font-weight:700;
}
</style>
</head>

<body>

<div id="speed">
    <div id="value">0</div>
    <div id="unit">KM/H</div>
</div>

<script>
const value = document.getElementById("value");

let lastPosition = null;
let lastSpeed = -1;

const R = 6371000;
const PI = Math.PI / 180;

function distance(a,b,c,d){
    const dLat = (c-a)*PI;
    const dLon = (d-b)*PI;

    const s =
        Math.sin(dLat/2)**2 +
        Math.cos(a*PI) *
        Math.cos(c*PI) *
        Math.sin(dLon/2)**2;

    return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}

navigator.geolocation.watchPosition(pos=>{

    let kmh = 0;

    if(pos.coords.speed != null){
        kmh = pos.coords.speed * 3.6;
    }else if(lastPosition){

        const d = distance(
            lastPosition.coords.latitude,
            lastPosition.coords.longitude,
            pos.coords.latitude,
            pos.coords.longitude
        );

        const dt = (pos.timestamp - lastPosition.timestamp) / 1000;

        if(dt>0) kmh = d / dt * 3.6;
    }

    lastPosition = pos;

    const speed = kmh < 1 ? 0 : Math.round(kmh);

    if(speed !== lastSpeed){
        lastSpeed = speed;
        value.textContent = speed;
    }

},console.error,{
    enableHighAccuracy:true,
    maximumAge:0,
    timeout:5000
});
</script>

</body>
</html>
