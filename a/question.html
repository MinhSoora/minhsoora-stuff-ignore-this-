<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bộ câu hỏi tình huống — Tính kỉ luật</title>
<style>
  :root{
    --bg:#f6f3ee; --card:#ffffff; --ink:#26231f; --muted:#7a746a;
    --accent:#b5482e; --accent-2:#2f6b4f;
    --pending:#f4c542; --pending-bg:#fff8e3;
    --correct:#2f6b4f; --correct-bg:#e7f3ea;
    --wrong:#b5482e; --wrong-bg:#fbeae6;
    --border:#e4ddd0; --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1a17; --card:#28251f; --ink:#ece7dd; --muted:#a79f8f;
      --border:#3a352c; --pending-bg:#3a3116; --correct-bg:#1e3226; --wrong-bg:#3a2620;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1c1a17; --card:#28251f; --ink:#ece7dd; --muted:#a79f8f;
    --border:#3a352c; --pending-bg:#3a3116; --correct-bg:#1e3226; --wrong-bg:#3a2620;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Georgia","Iowan Old Style",serif;
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    overflow:hidden;
  }
  .topbar{
    display:flex;align-items:center;gap:12px;padding:14px 20px;
    border-bottom:1px solid var(--border);
    font-family:"Helvetica Neue",Arial,sans-serif;flex:0 0 auto;
  }
  .topbar h1{font-size:1rem;margin:0;font-weight:700;letter-spacing:.3px;flex:0 0 auto;white-space:nowrap;}
  .progress-track{flex:1;height:6px;background:var(--border);border-radius:999px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent-2);width:0%;transition:width .35s ease;}
  .counter{flex:0 0 auto;font-size:.82rem;color:var(--muted);white-space:nowrap;}
  .icon-btn{
    background:var(--card);border:1px solid var(--border);border-radius:50%;
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:.95rem;flex:0 0 auto;color:var(--ink);
  }
  .stage{flex:1 1 auto;min-height:0;display:flex;justify-content:center;padding:20px;}

  /* ===== Layout: Câu hỏi + 4 Mệnh đề + ô Đ/S ===== */
  .frame{
    width:100%;max-width:880px;max-height:100%;
    display:flex;flex-direction:column;gap:12px;overflow-y:auto;
    animation:slideIn .35s ease;
  }
  @keyframes slideIn{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:none;}}
  .qbox{
    flex:0 0 auto;background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);padding:20px 24px;
    box-shadow:0 4px 24px rgba(0,0,0,0.08);
  }
  .qtag{
    display:inline-block;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;
    color:var(--accent);font-family:"Helvetica Neue",Arial,sans-serif;font-weight:700;margin-bottom:8px;
  }
  .qtext{font-size:1.05rem;line-height:1.55;}
  .row{flex:1 0 auto;display:flex;gap:12px;align-items:stretch;}
  .stmt{
    flex:1 1 auto;background:var(--card);border:1.5px solid var(--border);
    border-radius:12px;padding:14px 18px;font-size:.98rem;line-height:1.5;
    display:flex;flex-direction:column;justify-content:center;
    transition:background .25s ease,border-color .25s ease;
  }
  .stmt .exp{
    display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--correct);
    font-size:.9rem;line-height:1.55;
  }
  .stmt .exp b{font-family:"Helvetica Neue",Arial,sans-serif;color:var(--correct);}
  .row.revealed .exp{display:block;animation:slideIn .3s ease;}
  .ans{
    flex:0 0 92px;border:1.5px solid var(--pending);background:var(--pending-bg);color:var(--ink);
    border-radius:12px;cursor:pointer;
    font-family:"Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:1.05rem;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease,background .25s ease,border-color .25s ease;
  }
  .ans:hover{border-color:var(--accent-2);}
  .ans:active{transform:scale(.96);}
  .row.revealed .ans{cursor:default;color:#fff;}
  .row.revealed.is-true .ans{background:var(--correct);border-color:var(--correct);animation:pop .4s ease;}
  .row.revealed.is-true .stmt{background:var(--correct-bg);border-color:var(--correct);}
  .row.revealed.is-false .ans{background:var(--wrong);border-color:var(--wrong);animation:shake .4s ease;}
  .row.revealed.is-false .stmt{background:var(--wrong-bg);border-color:var(--wrong);}
  .row.revealed.is-false .exp{border-top-color:var(--wrong);}
  .row.revealed.is-false .exp b{color:var(--wrong);}
  @keyframes pop{0%{transform:scale(1);}35%{transform:scale(1.06);}100%{transform:scale(1);}}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-4px);}40%{transform:translateX(4px);}60%{transform:translateX(-3px);}80%{transform:translateX(3px);}}

  .navbar{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 20px calc(env(safe-area-inset-bottom,0px) + 14px);
    border-top:1px solid var(--border);font-family:"Helvetica Neue",Arial,sans-serif;
  }
  .nav-btn{
    background:var(--card);border:1px solid var(--border);color:var(--ink);
    border-radius:999px;padding:10px 18px;font-size:.9rem;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:6px;white-space:nowrap;
    transition:opacity .2s ease,transform .15s ease;
  }
  .nav-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .nav-btn:disabled{opacity:.35;cursor:not-allowed;}
  .nav-btn:active{transform:scale(.96);}
  .dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:30%;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--border);transition:background .2s ease,transform .2s ease;}
  .dot.active{background:var(--accent);transform:scale(1.3);}
  .dot.done{background:var(--accent-2);}
</style>
</head>
<body>
  <div class="topbar">
    <h1>Tính kỉ luật</h1>
    <div class="progress-track"><div class="progress-fill" id="fill"></div></div>
    <div class="counter" id="counter">1 / 5</div>
    <button class="icon-btn" id="sound" title="Bật/tắt âm thanh">🔊</button>
    <button class="icon-btn" id="theme" title="Đổi giao diện sáng/tối">🌓</button>
  </div>

  <div class="stage" id="stage"></div>

  <div class="navbar">
    <button class="nav-btn" id="prev">← Trước</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn primary" id="all">Hiện tất cả</button>
    <button class="nav-btn" id="next">Tiếp →</button>
  </div>

<script>
const questions = [
{
  tag:"Câu 1",
  text:"Sáng Chủ nhật, nhà trường tổ chức cho học sinh tuyên truyền vận động người dân thực hiện nếp sống văn minh. Do ngại tham gia nên Nam rủ Sơn đi đá bóng. Xét các ý sau, ý nào đúng, ý nào sai?",
  items:[
    {t:"Sơn đi đá bóng cùng Nam vì buổi tuyên truyền không điểm danh.", a:false,
     e:"Kỉ luật là tự giác làm điều đã cam kết, không phụ thuộc vào việc có ai kiểm tra hay không."},
    {t:"Sơn tham gia tuyên truyền và rủ Nam đi cùng.", a:true,
     e:"Sơn giữ đúng trách nhiệm, đồng thời giúp bạn thay đổi thái độ."},
    {t:"Nếu Sơn tham gia vì sợ bị thầy cô nhắc nhở thì vẫn là có kỉ luật đầy đủ.", a:false,
     e:"Làm vì sợ bị phạt là bị ép buộc, chưa phải tự giác."},
    {t:"Sơn tham gia tuyên truyền rồi hẹn Nam đá bóng vào buổi chiều.", a:true,
     e:"Sơn vừa làm đúng nhiệm vụ, vừa đáp ứng được sở thích vào thời gian phù hợp."}
  ]
},
{
  tag:"Câu 2",
  text:"Hiền vội đến trường nên quên mang giày thể thao để học giờ Giáo dục thể chất. Hiền đã đi được nửa quãng đường nhưng nếu quay về lấy giày vẫn kịp giờ. Hiền rủ Hằng quay về cùng, nhưng Hằng nói: “Thôi kệ đi! Không ai để ý đâu.” Xét các ý sau, ý nào đúng, ý nào sai?",
  items:[
    {t:"Hiền đến lớp và nói với thầy là giày bị hỏng.", a:false,
     e:"Nói dối để che lỗi là vi phạm sự trung thực, lại thêm một lỗi nữa."},
    {t:"Hiền quay về lấy giày vì vẫn còn kịp giờ.", a:true,
     e:"Khi còn cách khắc phục thì nên khắc phục ngay, đó là tuân thủ quy định."},
    {t:"Câu “Không ai để ý đâu” của Hằng thể hiện suy nghĩ chỉ tuân thủ khi có người giám sát.", a:true,
     e:"Đây là quan điểm trái với tính kỉ luật, vì kỉ luật thể hiện rõ nhất khi không có ai theo dõi."},
    {t:"Nếu giáo viên không kiểm tra thì việc thiếu giày không phải là vi phạm.", a:false,
     e:"Vi phạm hay không do quy định xác định, không phụ thuộc vào việc có bị phát hiện hay không."}
  ]
},
{
  tag:"Câu 3",
  text:"Câu lạc bộ nghệ thuật của Tùng được phân công biểu diễn tiểu phẩm về chủ đề “Bảo vệ môi trường” vào sáng thứ Hai. Theo quy định của nhóm, Tùng phải đưa kịch bản cho các bạn vào ngày mai nhưng Tùng chưa viết xong. Tối nay, Tùng lại được mời đi xem một vở kịch mà Tùng rất thích. Xét các ý sau, ý nào đúng, ý nào sai?",
  items:[
    {t:"Tùng từ chối đi xem tối nay, hoàn thành kịch bản và hẹn xem vở khác.", a:true,
     e:"Tùng ưu tiên nhiệm vụ đã cam kết, còn sở thích có thể sắp xếp lại vào dịp khác."},
    {t:"Tùng đi xem rồi dậy sớm sáng mai viết nốt vì vẫn kịp.", a:false,
     e:"Dồn việc vào phút chót có rủi ro cao (ngủ quên, trục trặc), có thể không kịp nộp."},
    {t:"Tùng nhờ một bạn trong nhóm viết giúp phần còn lại để đi xem.", a:false,
     e:"Đây là hành vi đẩy việc của mình cho người khác."},
    {t:"Nếu Tùng nộp trễ, các bạn sẽ thiếu thời gian tập luyện cho buổi biểu diễn.", a:true,
     e:"Kịch bản là đầu vào cho các bước tiếp theo, nên nộp trễ sẽ ảnh hưởng đến cả nhóm."}
  ]
},
{
  tag:"Câu 4",
  text:"Theo lịch, hằng tuần vào sáng Chủ nhật, mỗi gia đình đều phải có người tham gia dọn vệ sinh đường làng, ngõ xóm. Chủ nhật tuần này, mọi người trong gia đình Mai đều đi vắng, chỉ còn Mai ở nhà. Sáng hôm đó, Mai có bạn rủ đi chơi. Xét các ý sau, ý nào đúng, ý nào sai?",
  items:[
    {t:"Mai đi chơi với bạn vì cả nhà đều vắng nên không ai trách.", a:false,
     e:"Lí do “không ai trách” không làm mất đi trách nhiệm của gia đình với cộng đồng."},
    {t:"Mai tham gia dọn vệ sinh thay mặt gia đình.", a:true,
     e:"Quy định yêu cầu mỗi gia đình đều có người tham gia, và Mai là người duy nhất ở nhà."},
    {t:"Mai nhắn bạn, hẹn đi chơi sau khi dọn vệ sinh xong.", a:true,
     e:"Mai giữ đúng cam kết và vẫn xử lí tốt lời rủ của bạn."},
    {t:"Một mình Mai dọn thì không bằng cả nhà, nên không đáng làm.", a:false,
     e:"Kỉ luật không đo bằng khối lượng việc làm được, mà bằng việc có thực hiện cam kết hay không."}
  ]
},
{
  tag:"Câu 5",
  text:"Cuối tuần, cửa hàng trong khu vực nhà Hà ở có nhiều mặt hàng giảm giá mà gia đình bạn và nhiều gia đình khác đều cần. Bố mẹ bạn đi thăm ông bà nên đưa tiền và dặn Hà những thứ cần mua. Hà ngủ quên nên lúc ra cửa hàng đã thấy mọi người xếp hàng dài. Đang sốt ruột và lo lắng khi đến lượt sẽ hết hàng cần mua, thì Hà nhìn thấy An sắp đến lượt đang vẫy Hà. Hà chạy lên, An rủ Hà chen đứng vào chỗ trên bạn ấy. Xét các ý sau, ý nào đúng, ý nào sai?",
  items:[
    {t:"Hà xếp hàng ở cuối hàng.", a:true,
     e:"Hà tuân thủ quy tắc nơi công cộng và công bằng với mọi người."},
    {t:"Hà nhờ An mua giúp phần của mình trong lượt của An.", a:false,
     e:"Về bản chất vẫn là đứng ngoài hàng mà mua trước những người đến sớm hơn."},
    {t:"Hà đến muộn do ngủ quên nên không được chuyển hậu quả sang người khác.", a:true,
     e:"Nguyên nhân là lỗi của Hà, vì vậy Hà phải tự chịu hậu quả và rút kinh nghiệm."},
    {t:"Sốt ruột và lo hết hàng là lí do chính đáng để Hà chen hàng.", a:false,
     e:"Cảm xúc của bản thân không thể là lí do vi phạm quy tắc chung, vì những người đứng sau đều bị lùi một vị trí."}
  ]
}
];

const LET = ["a","b","c","d"];
const revealed = questions.map(q => q.items.map(()=>false));
let current = 0, soundOn = true;

/* ---- âm thanh ---- */
let ctx=null;
function tone(f,s,d,type='triangle',g=.16){
  if(!soundOn) return;
  try{
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended') ctx.resume();
    const o=ctx.createOscillator(), gn=ctx.createGain();
    o.type=type;o.frequency.value=f;
    gn.gain.setValueAtTime(0,ctx.currentTime+s);
    gn.gain.linearRampToValueAtTime(g,ctx.currentTime+s+.02);
    gn.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+s+d);
    o.connect(gn);gn.connect(ctx.destination);
    o.start(ctx.currentTime+s);o.stop(ctx.currentTime+s+d+.05);
  }catch(e){}
}
const sndRight=()=>{tone(523,0,.12);tone(659,.1,.12);tone(784,.2,.2);};
const sndWrong=()=>{tone(220,0,.16,'sawtooth',.1);tone(185,.12,.24,'sawtooth',.1);};
const sndSlide=()=>{tone(440,0,.06,'sine',.06);tone(660,.04,.08,'sine',.05);};

/* ---- render ---- */
const stage=document.getElementById('stage');
const dotsEl=document.getElementById('dots');

function render(){
  const q=questions[current];
  stage.innerHTML='';
  const frame=document.createElement('div');frame.className='frame';

  const qb=document.createElement('div');qb.className='qbox';
  const tag=document.createElement('div');tag.className='qtag';tag.textContent=q.tag;
  const tx=document.createElement('div');tx.className='qtext';tx.textContent=q.text;
  qb.append(tag,tx);frame.appendChild(qb);

  q.items.forEach((it,i)=>{
    const row=document.createElement('div');
    row.className='row'+(revealed[current][i]?' revealed '+(it.a?'is-true':'is-false'):'');
    const st=document.createElement('div');st.className='stmt';
    const m=document.createElement('div');m.textContent=LET[i]+")  "+it.t;
    const ex=document.createElement('div');ex.className='exp';
    ex.innerHTML='<b>Giải thích:</b> ';
    ex.appendChild(document.createTextNode(it.e));
    st.append(m,ex);
    const ans=document.createElement('button');ans.type='button';ans.className='ans';
    ans.textContent=revealed[current][i]?(it.a?'ĐÚNG':'SAI'):'Đ/S';
    ans.addEventListener('click',()=>revealRow(i));
    row.append(st,ans);frame.appendChild(row);
  });
  stage.appendChild(frame);
  updateBar();
}

function revealRow(i){
  if(revealed[current][i]) return;
  revealed[current][i]=true;
  questions[current].items[i].a ? sndRight() : sndWrong();
  const rows=stage.querySelectorAll('.row');
  const it=questions[current].items[i], row=rows[i];
  row.classList.add('revealed',it.a?'is-true':'is-false');
  row.querySelector('.ans').textContent=it.a?'ĐÚNG':'SAI';
  updateBar();
}

function updateBar(){
  const total=questions.length*4;
  const done=revealed.flat().filter(Boolean).length;
  document.getElementById('fill').style.width=(done/total*100)+'%';
  document.getElementById('counter').textContent=`${current+1} / ${questions.length}`;
  dotsEl.innerHTML='';
  questions.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(i===current?' active':'')+(revealed[i].every(Boolean)?' done':'');
    dotsEl.appendChild(d);
  });
  document.getElementById('prev').disabled=current===0;
  document.getElementById('next').disabled=current===questions.length-1;
  const allDone=revealed[current].every(Boolean);
  document.getElementById('all').textContent=allDone?'Ẩn tất cả':'Hiện tất cả';
}

function goTo(n){
  if(n<0||n>=questions.length) return;
  current=n;sndSlide();render();
}

document.getElementById('prev').onclick=()=>goTo(current-1);
document.getElementById('next').onclick=()=>goTo(current+1);
document.getElementById('all').onclick=()=>{
  const allDone=revealed[current].every(Boolean);
  revealed[current]=revealed[current].map(()=>!allDone);
  if(!allDone) sndRight();
  render();
};
document.getElementById('theme').onclick=()=>{
  const r=document.documentElement,c=r.getAttribute('data-theme');
  if(c==='dark') r.setAttribute('data-theme','light');
  else if(c==='light') r.removeAttribute('data-theme');
  else r.setAttribute('data-theme','dark');
};
document.getElementById('sound').onclick=e=>{
  soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊':'🔇';
};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') goTo(current+1);
  else if(e.key==='ArrowLeft') goTo(current-1);
  else if(e.key===' '||e.key==='Enter'){
    const i=revealed[current].indexOf(false);
    if(i>-1){e.preventDefault();revealRow(i);}
  }
});

render();
</script>
</body>
</html>
