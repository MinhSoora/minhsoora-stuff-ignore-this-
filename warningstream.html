<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Widget cảnh báo stream 16+</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@700;800&display=swap&subset=vietnamese" rel="stylesheet">
<style>
/*
  OBS: Browser Source -> Local file (hoặc URL) -> Width 1920, Height 1080.
  Tùy chỉnh bằng tham số URL, ví dụ:
  ?top1=CẢNH BÁO STREAM&main1=STREAM 16%2B&bot1=CÂN NHẮC TRƯỚC KHI XEM
  &top2=NHANH LÊN!&main2=ĐĂNG KÝ KÊNH&hold1=3&hold2=3&loop=0&bg=transparent
*/
:root { --ink:#141414; --paper:#fff; --black:#000; --ease:cubic-bezier(.16,1,.3,1); }
html, body { margin:0; height:100%; background:transparent; overflow:hidden; }
body { display:grid; place-items:center; }

/* Khung 16:9 luôn vừa với cửa sổ */
.stage {
  position:relative; overflow:hidden; background:var(--black);
  width:min(100vw, 100vh * 16 / 9); aspect-ratio:16/9;
  container-type:size;
  font-family:"Jost","Futura","Century Gothic","Avenir Next",sans-serif;
  font-weight:800;
}
body.transparent .stage { background:transparent; }

/* Bố cục theo video: dải trên / dải trắng / dải dưới */
.row {
  position:absolute; left:0; width:100%;
  display:flex; align-items:center; justify-content:center;
  white-space:nowrap; will-change:transform;
  transform:translateX(100%);
}
.top  { top:0;      height:19.6%; color:var(--paper); font-size:9cqh;  letter-spacing:.01em; }
.band { top:19.6%;  height:52.1%; left:-2px; width:calc(100% + 4px); background:var(--paper); color:var(--ink); font-size:25cqh; letter-spacing:-.01em; }
.bot  { top:71.7%;  height:28.3%; color:var(--paper); font-size:9cqh;  letter-spacing:.01em; }
.bot, .top { font-weight:700; }
.band span { display:block; will-change:transform; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="set" id="s1">
    <div class="row top"></div>
    <div class="row band"><span></span></div>
    <div class="row bot"></div>
  </div>
  <div class="set" id="s2">
    <div class="row top"></div>
    <div class="row band"><span></span></div>
    <div class="row bot"></div>
  </div>
</div>

<script>
(() => {
  const q = new URLSearchParams(location.search);
  const get = (k, d) => (q.has(k) ? q.get(k) : d);
  const cfg = {
    top1:  get('top1',  'CẢNH BÁO STREAM'),
    main1: get('main1', 'STREAM 16+'),
    bot1:  get('bot1',  'CÂN NHẮC TRƯỚC KHI XEM'),
    top2:  get('top2',  'NHANH LÊN!'),
    main2: get('main2', 'ĐĂNG KÝ KÊNH'),
    bot2:  get('bot2',  ''),
    hold1: +get('hold1', 2.5),   // giây giữ màn 1
    hold2: +get('hold2', 2.6),   // giây giữ màn 2
    gap:   +get('gap',   3),     // giây nghỉ giữa các vòng
    loop:  get('loop', '1') !== '0'
  };
  if (get('bg', '') === 'transparent') document.body.classList.add('transparent');

  const fill = (id, t, m, b) => {
    const s = document.getElementById(id);
    s.querySelector('.top').textContent = t;
    s.querySelector('.band span').textContent = m;
    s.querySelector('.bot').textContent = b;
    return {
      top: s.querySelector('.top'), band: s.querySelector('.band'),
      txt: s.querySelector('.band span'), bot: s.querySelector('.bot')
    };
  };
  const A = fill('s1', cfg.top1, cfg.main1, cfg.bot1);
  const B = fill('s2', cfg.top2, cfg.main2, cfg.bot2);

  const EASE = 'cubic-bezier(.16,1,.3,1)';
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const move = (el, from, to, dur, delay = 0) =>
    el.animate([{ transform: `translateX(${from}%)` }, { transform: `translateX(${to}%)` }],
               { duration: dur, delay, easing: EASE, fill: 'forwards' }).finished;

  // Một màn trượt vào/ra: dải trắng dẫn đầu, chữ dải dưới rồi chữ dải trên trễ dần (như video)
  // st = 1: có độ trễ giữa các lớp (lúc vào đầu tiên); st = 0: mọi lớp đi cùng nhau (lúc nối màn)
  const slide = (S, from, to, dur, st = 1) => Promise.all([
    move(S.band, from, to, dur, 0),
    move(S.txt,  from * .06 * st, to * .06 * st, dur, 40 * st),
    move(S.bot,  from, to, dur, 60 * st),
    move(S.top,  from, to, dur, 120 * st)
  ]);
  // ở vị trí nghỉ, chữ trong dải phải về 0
  const rest = S => S.txt.getAnimations().forEach(a => a.cancel());

  async function play() {
    for (const S of [A, B]) [S.top, S.band, S.bot, S.txt].forEach(e => e.getAnimations().forEach(a => a.cancel()));
    await slide(A, 100, 0, 1000);            // 0.0s: màn 1 trượt từ phải, giảm tốc
    await wait(cfg.hold1 * 1000);
    await Promise.all([                       // đẩy sang màn 2: màn 1 ra trái, màn 2 vào phải
      slide(A, 0, -100, 700, 0),
      slide(B, 100, 0, 700, 0)
    ]);
    if (!cfg.loop) return;                    // loop=0: giữ nguyên màn cuối như video
    await wait(cfg.hold2 * 1000);
    await slide(B, 0, -100, 700, 0);
    await wait(cfg.gap * 1000);
    play();
  }
  play();
})();
</script>
</body>
</html>
