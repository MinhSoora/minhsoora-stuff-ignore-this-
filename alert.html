<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

body {
    font-family: Arial, Tahoma, Verdana, sans-serif;
}

.marquee {
    position: absolute;
    bottom: 20px;
    left: 0;
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
    pointer-events: none;
}

.marquee span {
    display: inline-block;
    padding-left: 100%;
    animation: marquee 18s linear infinite;

    font-family: Arial, Tahoma, Verdana, sans-serif;
    font-size: 34px;
    font-weight: bold;
    color: #FFFFFF;

    text-shadow:
        2px 2px 4px rgba(0,0,0,1),
        0 0 8px rgba(0,0,0,.9),
        0 0 12px rgba(0,0,0,.7);
}

@keyframes marquee {
    from {
        transform: translateX(0);
    }
    to {
        transform: translateX(-100%);
    }
}
</style>
</head>

<body>

<div class="marquee">
    <span>
        ⚠️ CẢNH BÁO: Stream có thể sử dụng ngôn từ hoặc hình ảnh không phù hợp với một số người xem. Hãy cân nhắc trước khi tiếp tục theo dõi. &nbsp;&nbsp;&nbsp;&nbsp; ⚠️ CẢNH BÁO: Stream có thể sử dụng ngôn từ hoặc hình ảnh không phù hợp với một số người xem. Hãy cân nhắc trước khi tiếp tục theo dõi.
    </span>
</div>

</body>
</html>
