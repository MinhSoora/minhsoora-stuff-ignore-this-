<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Overlay - Donate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: transparent;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Container cho donate notify ở giữa */
        .donate-notify-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 400px;
            z-index: 10;
        }

        /* Container cho bảng xếp hạng ở góc phải */
        .leaderboard-container {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 350px;
            height: 500px;
            z-index: 5;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: transparent;
        }

        /* Style cho container để dễ nhìn khi test */
        .donate-notify-container,
        .leaderboard-container {
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <!-- Donate Notify ở giữa màn hình -->
    <div class="donate-notify-container">
        <iframe 
            src="https://zypage.com/donate-message/ca32421f326ace4afa951816a4984b426c82ae81"
            allowtransparency="true"
            scrolling="no">
        </iframe>
    </div>

    <!-- Bảng xếp hạng ở góc phải -->
    <div class="leaderboard-container">
        <iframe 
            src="https://zypage.com/donate-top/ca32421f326ace4afa951816a4984b426c82ae81?type=text&time=all&limit=10&amount=yes"
            allowtransparency="true"
            scrolling="no">
        </iframe>
    </div>
</body>
</html>
