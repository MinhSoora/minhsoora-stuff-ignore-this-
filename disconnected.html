<style>
  :root {
    --void-1: #0a0d10;
    --void-2: #14181c;
    --red: #ff3b3b;
    --red-dim: #5c1717;
    --text: #eef1f3;
    --text-dim: #8a9199;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "JetBrains Mono", monospace;
  }

  /* Lop anh nen ngau nhien: 2 layer chong nhau de crossfade muot khi doi anh */
  .bg-stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    background: var(--void-1);
  }

  .bg-photo {
    position: absolute;
    inset: -6%;
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    filter: blur(22px) brightness(0.5) saturate(1.05);
    opacity: 0;
    transition: opacity 2.2s ease;
    animation: kenburns 34s ease-in-out infinite alternate;
    will-change: opacity, transform;
  }

  .bg-photo.active {
    opacity: 1;
  }

  @keyframes kenburns {
    from { transform: scale(1) translate(0, 0); }
    to   { transform: scale(1.05) translate(-0.8%, 0.5%); }
  }

  .cover {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse 60% 50% at 50% 42%, rgba(255, 59, 59, 0.14), transparent 65%),
      repeating-linear-gradient(
        0deg,
        rgba(255, 255, 255, 0.018) 0px,
        rgba(255, 255, 255, 0.018) 1px,
        transparent 1px,
        transparent 3px
      ),
      linear-gradient(180deg, rgba(10, 13, 16, 0.74) 0%, rgba(20, 24, 28, 0.84) 100%);
  }

  /* vach quet tin hieu */
  .scan {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    top: -2px;
    background: linear-gradient(90deg, transparent, rgba(255, 59, 59, 0.85), transparent);
    filter: blur(0.4px);
    animation: sweep 6s linear infinite;
  }

  @keyframes sweep {
    0% { top: -2px; opacity: 0; }
    8% { opacity: 1; }
    92% { opacity: 1; }
    100% { top: 100%; opacity: 0; }
  }

  /* vien vignette */
  .vignette {
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 18vw rgba(0, 0, 0, 0.55);
    pointer-events: none;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 26px;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 8px 2px var(--red), 0 0 22px 6px rgba(255, 59, 59, 0.45);
    animation: blink 2s steps(2, end) infinite;
  }

  @keyframes blink {
    50% { opacity: 0.18; }
  }

  .eyebrow {
    font-size: 15px;
    letter-spacing: 0.42em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    font-family: "Oswald", sans-serif;
    font-weight: 700;
    font-size: 6.2vw;
    line-height: 1;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text);
    text-shadow: 0 0 22px rgba(255, 59, 59, 0.55), 0 0 60px rgba(255, 59, 59, 0.25);
    text-align: center;
  }

  .sub {
    margin-top: 16px;
    font-size: 1.1vw;
    min-font-size: 16px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  .sub .caret {
    display: inline-block;
    width: 0.55em;
    background: var(--text-dim);
    margin-left: 2px;
    animation: caret 1.5s steps(2, end) infinite;
  }

  @keyframes caret {
    50% { opacity: 0; }
  }

  .bars {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    margin-top: 46px;
    height: 46px;
  }

  .bars .bar {
    width: 10px;
    background: var(--red-dim);
    border-radius: 2px;
    animation: dead 2.8s ease-in-out infinite;
  }

  .bars .bar:nth-child(1) { height: 30%; animation-delay: 0s; }
  .bars .bar:nth-child(2) { height: 50%; animation-delay: 0.25s; }
  .bars .bar:nth-child(3) { height: 70%; animation-delay: 0.5s; }
  .bars .bar:nth-child(4) { height: 90%; animation-delay: 0.75s; }
  .bars .bar:nth-child(5) { height: 100%; animation-delay: 1s; }

  @keyframes dead {
    0%, 100% { opacity: 0.22; }
    50% { opacity: 0.7; background: var(--red); box-shadow: 0 0 10px rgba(255, 59, 59, 0.5); }
  }

  .frame-corner {
    position: absolute;
    width: 46px;
    height: 46px;
    border: 2px solid rgba(255, 59, 59, 0.35);
  }
  .frame-corner.tl { top: 5vh; left: 5vh; border-right: none; border-bottom: none; }
  .frame-corner.tr { top: 5vh; right: 5vh; border-left: none; border-bottom: none; }
  .frame-corner.bl { bottom: 5vh; left: 5vh; border-right: none; border-top: none; }
  .frame-corner.br { bottom: 5vh; right: 5vh; border-left: none; border-top: none; }

  @media (prefers-reduced-motion: reduce) {
    .scan, .dot, .sub .caret, .bars .bar, .bg-photo { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="bg-stage">
    <div class="bg-photo" id="bg-a"></div>
    <div class="bg-photo" id="bg-b"></div>
  </div>

  <audio id="disconnect-audio" preload="none"></audio>

  <div class="cover">
    <div class="scan"></div>
    <div class="vignette"></div>

    <div class="frame-corner tl"></div>
    <div class="frame-corner tr"></div>
    <div class="frame-corner bl"></div>
    <div class="frame-corner br"></div>

    <div class="status-row">
      <span class="dot"></span>
      <span class="eyebrow">Tín hiệu gián đoạn</span>
    </div>

    <h1>Mất kết nối</h1>

    <div class="sub">Đang cố gắng kết nối lại, vui lòng chờ trong giây lát<span class="caret">_</span></div>

    <div class="bars">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/bg-list.js"></script>
  <script>
  (function () {
    // ================= Anh nen ngau nhien (blur + hieu ung ken-burns) =================
    var layers = [document.getElementById('bg-a'), document.getElementById('bg-b')];
    var activeIdx = 0;
    var bgTimer = null;
    var recentUrls = [];

    function pickRandomImage() {
      var list = (window.BG_IMAGE_LIST || []).filter(Boolean);
      if (!list.length) return null;
      if (list.length === 1) return list[0];
      var choices = list.filter(function (u) { return u !== recentUrls[recentUrls.length - 1]; });
      var pool = choices.length ? choices : list;
      var url = pool[Math.floor(Math.random() * pool.length)];
      recentUrls.push(url);
      if (recentUrls.length > 5) recentUrls.shift();
      return url;
    }

    function showNextBg() {
      var url = pickRandomImage();
      if (!url) return;
      var nextIdx = activeIdx === 0 ? 1 : 0;
      var nextEl = layers[nextIdx];
      var curEl = layers[activeIdx];
      nextEl.style.backgroundImage = 'url("' + url + '")';
      // ep restart animation ken-burns tren layer moi
      nextEl.style.animation = 'none';
      void nextEl.offsetWidth;
      nextEl.style.animation = '';
      nextEl.classList.add('active');
      curEl.classList.remove('active');
      activeIdx = nextIdx;
    }

    function scheduleNextBg() {
      clearTimeout(bgTimer);
      var delay = 9000 + Math.random() * 6000; // 9-15s moi lan doi anh, cam giac tu nhien
      bgTimer = setTimeout(function () {
        showNextBg();
        scheduleNextBg();
      }, delay);
    }

    function startBgRotation() {
      if (!(window.BG_IMAGE_LIST || []).length) return;
      showNextBg();
      scheduleNextBg();
    }

    function stopBgRotation() {
      clearTimeout(bgTimer);
      bgTimer = null;
    }

    // ================= Nhac ngau nhien, lap lien tuc =================
    var audioEl = document.getElementById('disconnect-audio');
    var playlist = [];
    var queue = [];
    var playlistLoaded = false;
    var wantPlaying = false;

    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    function refillQueue() {
      queue = shuffle(playlist);
      // tranh phat lai ngay bai vua ket thuc khi vong lap moi bat dau
      if (queue.length > 1 && queue[0] === audioEl.dataset.lastUrl) {
        queue.push(queue.shift());
      }
    }

    function playNextTrack() {
      if (!playlist.length) return;
      if (!queue.length) refillQueue();
      var url = queue.shift();
      audioEl.dataset.lastUrl = url;
      audioEl.src = url;
      var p = audioEl.play();
      if (p && typeof p.catch === 'function') {
        p.catch(function () {
          // trinh duyet chan autoplay co am thanh -> thu phat lai khi co tuong tac dau tien
          function retry() {
            audioEl.play().catch(function () {});
            document.removeEventListener('click', retry);
            document.removeEventListener('keydown', retry);
          }
          document.addEventListener('click', retry);
          document.addEventListener('keydown', retry);
        });
      }
    }

    audioEl.addEventListener('ended', function () {
      if (wantPlaying) playNextTrack();
    });

    function loadPlaylist() {
      if (playlistLoaded) return Promise.resolve();
      return fetch('/api/disconnect-audio')
        .then(function (r) { return r.json(); })
        .then(function (list) {
          playlist = Array.isArray(list) ? list : [];
          playlistLoaded = true;
        })
        .catch(function () {
          playlist = [];
          playlistLoaded = true;
        });
    }

    function startAudio() {
      wantPlaying = true;
      loadPlaylist().then(function () {
        if (wantPlaying && playlist.length) playNextTrack();
      });
    }

    function stopAudio() {
      wantPlaying = false;
      audioEl.pause();
      audioEl.removeAttribute('src');
      audioEl.load();
      queue = [];
    }

    // ================= Theo doi trang thai that tu server =================
    // Trang nay luon duoc preload an ngoai man hinh boi index.html, nen KHONG the
    // dua vao viec iframe "dang hien" de bat/tat nhac hay anh nen. Thay vao do,
    // tu ket noi thang toi server (cung /api/state + Socket.IO) de biet chinh xac
    // webhook "disconnect" dang BAT hay TAT, doc lap voi hieu ung truot cua khung cha.
    var isActive = false;

    function applyActive(active) {
      active = !!active;
      if (active === isActive) return;
      isActive = active;
      if (active) {
        startBgRotation();
        startAudio();
      } else {
        stopBgRotation();
        stopAudio();
      }
    }

    fetch('/api/state')
      .then(function (r) { return r.json(); })
      .then(function (s) { applyActive(s.disconnected); })
      .catch(function () {});

    if (window.io) {
      var socket = window.io();
      socket.on('state', function (s) { applyActive(s.disconnected); });
    }
  })();
